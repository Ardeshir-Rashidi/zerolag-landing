name: Import supplied Next.js source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Expand reviewed project archive
        run: |
          test -f source-import.zip
          unzip -q source-import.zip
          rm source-import.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import ZeroLag Next.js marketing website and portfolio documentation'
          git push
